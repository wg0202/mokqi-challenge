<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#6759e8"><title>默契挑战 · 双人小游戏</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="bg-bubble b1"></div><div class="bg-bubble b2"></div><main class="app">
<header><div class="brand-icon">✦</div><div><div class="eyebrow">TWO PLAYER PARTY</div><h1>默契挑战</h1></div><span class="pill">双人联机 · 轻松一局</span></header>
<section id="welcome" class="panel hero"><div class="hero-copy"><span class="tag">👯 好友专属小游戏</span><h2>默契，不只是运气！</h2><p>答题、猜拳、拼手速，看看你们到底有多合拍。</p><div class="features"><span>⚡ 快速开局</span><span>💬 趣味互动</span><span>📱 手机电脑都能玩</span></div></div><div class="mascots"><div class="mascot blue">🐻‍❄️<small>你</small></div><div class="versus">VS</div><div class="mascot pink">🐰<small>好友</small></div></div></section>
<section id="lobby" class="panel"><h2>🎮 开始玩</h2><label>你的昵称<input id="name" maxlength="16" placeholder="取个可爱的名字" value="玩家"/></label><div class="button-row"><button id="create" class="primary">创建房间</button><button id="joinToggle" class="secondary">加入好友房间</button></div><div id="joinBox" class="join-box hidden"><label>房间码<input id="roomCode" maxlength="6" placeholder="输入好友的房间码" autocapitalize="characters"/></label><button id="join" class="primary">加入房间</button></div><p class="muted">创建房间后复制邀请链接发给好友。双方都打开链接即可开始。</p></section>
<section id="waiting" class="panel hidden"><div class="section-head"><h2>🏠 房间大厅</h2><span class="pill live">等待好友加入</span></div><p class="muted">把邀请链接发给好友，等他加入后就能开玩。</p><div class="room-code"><span>房间码</span><strong id="codeLabel">------</strong><button id="copyCode" class="small">复制房间码</button></div><div class="invite"><input id="inviteLink" readonly/><button id="copyLink" class="primary">复制邀请链接</button></div><div id="players" class="players"></div><button id="start" class="primary full" disabled>等待第二位玩家…</button><div id="notice" class="notice"></div></section>
<section id="game" class="panel hidden"><div class="section-head"><span class="pill" id="roundPill">第 1 / 5 轮</span><span class="scoreline" id="scoreline"></span></div><div class="progress"><div id="progressBar"></div></div><div class="game-heading"><div id="gameEmoji" class="game-emoji">🧠</div><h2 id="gameTitle">同步答题</h2><p id="prompt">准备好了吗？</p><p class="muted" id="tip"></p></div><div id="options" class="options"></div><div id="reactionBox" class="reaction-box hidden"><p id="reactionText">等待绿色信号…</p><button id="reactionButton" class="reaction-button" disabled>准备</button></div><div id="answerStatus" class="answer-status">选择答案后等待好友</div><div id="result" class="result hidden"></div><button id="next" class="primary full hidden">下一轮 →</button></section>
<section id="over" class="panel hidden"><div class="trophy">🏆</div><h2>挑战结束！</h2><p id="winnerText">你们都是默契高手！</p><div id="finalScores" class="final-scores"></div><button id="playAgain" class="primary full">再玩一局</button><button id="backLobby" class="secondary full">返回大厅</button></section>
<footer>✨ 一起玩，比赢更重要。 <span>默契挑战 v1.0</span></footer></main><div id="toast" class="toast"></div><script src="/socket.io/socket.io.js"></script><script src="/client.js"></script></body></html>
